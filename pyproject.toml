[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-system"
version = "1.0.0"
description = "Face Recognition Biometric Attendance System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Login>=0.6.0",
    "Flask-WTF>=1.2.0",
    "Werkzeug>=3.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "firebase-admin>=6.0.0"
]

[tool.vercel]
entrypoint = "api/index.py"
