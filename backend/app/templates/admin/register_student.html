{% extends "base.html" %}

{% block title %}Register Student{% endblock %}

{% block content %}
<div class="header-bar">
  <div>
    <h1 class="page-title">Add New Student</h1>
    <p class="page-subtitle">Enter student academic details before face biometric registration</p>
  </div>
  <a href="{{ url_for('admin.students') }}" class="btn btn-secondary">← Back to Directory</a>
</div>

<div class="card" style="max-width: 700px; margin: 0 auto;">
  <form method="POST" action="{{ url_for('admin.register_student') }}">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
      <div class="form-group">
        <label class="form-label" for="name">Full Name *</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Bhushan Padghan" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="roll_number">Roll Number *</label>
        <input type="text" id="roll_number" name="roll_number" class="form-control" placeholder="e.g. 101" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="student_id">Student ID / Reg No *</label>
        <input type="text" id="student_id" name="student_id" class="form-control" placeholder="e.g. STU-2026-101" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="course">Course / Department *</label>
        <input type="text" id="course" name="course" class="form-control" placeholder="e.g. B.Tech Computer Science" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="year">Year *</label>
        <select id="year" name="year" class="form-select" required>
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year" selected>3rd Year</option>
          <option value="4th Year">4th Year</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="division">Division / Section *</label>
        <input type="text" id="division" name="division" class="form-control" placeholder="e.g. Div A" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address (Optional)</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="student@college.edu">
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number (Optional)</label>
        <input type="text" id="phone" name="phone" class="form-control" placeholder="+91 9876543210">
      </div>
    </div>

    <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
      <a href="{{ url_for('admin.students') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save & Proceed to Face Registration →</button>
    </div>
  </form>
</div>
{% endblock %}
