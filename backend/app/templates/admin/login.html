{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px);">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 14px; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; font-size: 1.75rem;">🔒</div>
    <h2 style="font-size: 1.5rem; font-weight: 800;">Admin Login</h2>
    <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Face Recognition Biometric System</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Enter admin password" required>
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">Remember me</label>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">Login to Dashboard</button>
  </form>
</div>
{% endblock %}
